<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <!-- Tailwind CSS CDN para un diseño rápido y moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 12s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-8 shadow-2xl text-center relative overflow-hidden">
        
        <!-- Elemento decorativo de fondo -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Icono animado -->
        <div class="mb-6 inline-flex p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl text-indigo-400">
            <i class="fa-solid fa-gear text-4xl animate-spin-slow"></i>
        </div>

        <!-- Título -->
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight mb-3">
            Sitio en Construcción
        </h1>

        <!-- Descripción -->
        <p class="text-slate-400 text-sm sm:text-base mb-8 leading-relaxed">
            Estamos trabajando arduamente para brindarte una nueva y mejor experiencia. Muy pronto estaremos en línea.
        </p>

        <!-- Contador regresivo (Simulado) -->
        <div class="grid grid-cols-3 gap-3 mb-8">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
                <span id="days" class="block text-xl font-bold text-indigo-400">12</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Días</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
                <span id="hours" class="block text-xl font-bold text-indigo-400">08</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Horas</span>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
                <span id="minutes" class="block text-xl font-bold text-indigo-400">45</span>
                <span class="text-xs text-slate-500 uppercase tracking-wider">Min</span>
            </div>
        </div>

        <!-- Formulario de notificación -->
        <form onsubmit="event.preventDefault(); alert('¡Gracias! Te avisaremos cuando estemos listos.');" class="space-y-3">
            <div class="relative">
                <input type="email" placeholder="Ingresá tu correo electrónico" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-colors shadow-lg shadow-indigo-600/20 text-sm cursor-pointer">
                Avisarme cuando esté listo
            </button>
        </form>

        <!-- Redes sociales o pie -->
        <div class="mt-8 pt-6 border-t border-slate-800/60 flex justify-center space-x-4 text-slate-500">
            <a href="#" class="hover:text-indigo-400 transition-colors"><i class="fa-brands fa-twitter text-lg"></i></a>
            <a href="#" class="hover:text-indigo-400 transition-colors"><i class="fa-brands fa-instagram text-lg"></i></a>
            <a href="#" class="hover:text-indigo-400 transition-colors"><i class="fa-brands fa-github text-lg"></i></a>
        </div>

    </div>

</body>
</html>
